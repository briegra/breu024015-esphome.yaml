# Version: 2026-11-13.02######################################################

substitutions:
  devicename: "esp32-cam-gaszaehler"
  friendly_name: "ESP32-CAM-Gaszähler"
  mqtt_prefix: "Gaszaehler_Kamera"
  ap_fallback: "ESP32-CAM AP"

esphome:
  name: "${devicename}"
  friendly_name: "${friendly_name}"
  includes:
    - ap_name_mapper.h

  on_boot:
    priority: -100
    then:
      - lambda: |-
          ESP_LOGI("BOOT", "ESP32-CAM gestartet");
          ESP_LOGI("BOOT", "Warte auf Initialisierung: 10 Sekunden");
      - delay: 10s
      - lambda: |-
          id(restart_esp).turn_off();
          id(gs_restart_counter)++;
          id(gs_restart_counter_sensor).publish_state(id(gs_restart_counter));
          ESP_LOGI("BOOT", "Init abgeschlossen");

esp32:
  board: esp32cam

  framework:
    type: arduino

psram:

esp32_camera:
  id: gaszaehler_kamera
  name: "Gaszähler Snapshot"

  external_clock:
    pin: GPIO0
    frequency: 20MHz

  i2c_pins:
    sda: GPIO26
    scl: GPIO27

  data_pins:
    - GPIO5
    - GPIO18
    - GPIO19
    - GPIO21
    - GPIO36
    - GPIO39
    - GPIO34
    - GPIO35

  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32

  resolution: 1024x768
  max_framerate: 5 fps
  idle_framerate: 0 fps
  jpeg_quality: 20

esp32_camera_web_server:
  - port: 8081
    mode: snapshot

logger:
  level: DEBUG

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret vlan26_ssid
  password: !secret vlan26_pw

  fast_connect: false

  ap:
    ssid: "${ap_fallback}"
    password: !secret ap_password

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

web_server:
  port: 80

time:
  - platform: sntp
    id: system_time
    servers: time.myrbr.lcl
    timezone: Europe/Berlin

    on_time_sync:
      then:
        - logger.log: "SNTP-Zeit synchronisiert!"
        - component.update: se_esp_uptime
        - component.update: ts_last_boot_time

globals:
  - id: gs_restart_counter
    type: int
    restore_value: true
    initial_value: "0"

mqtt:
  topic_prefix: "${mqtt_prefix}"
  discovery: false
  broker: 192.168.24.15
  id: mqtt_client
  port: 1887
  username: !secret mqtt_user
  password: !secret mqtt_password
  reboot_timeout: 0s

output:
  - platform: ledc
    pin: GPIO4
    id: led_output
    frequency: 1000Hz

number:
  - platform: template
    name: "LED Helligkeit"
    id: led_brightness
    min_value: 0.0
    max_value: 1.0
    step: 0.05
    initial_value: 0.2
    optimistic: true
    restore_value: true

script:
  # Ablauf: LED an -> 1 s warten -> MQTT "new" -> ioBroker holt Snapshot
  # über Port 8081 (3 s Zeit) -> LED aus -> Schalter zurücksetzen
  - id: bild_aufnehmen
    mode: single
    then:
      - output.set_level:
          id: led_output
          level: !lambda 'return id(led_brightness).state;'
      - delay: 1000ms
      - mqtt.publish:
          topic: "${mqtt_prefix}/Camera/image/available"
          payload: "new"
          qos: 1
          retain: false
      - delay: 3000ms
      - output.set_level:
          id: led_output
          level: 0.0
      - switch.template.publish:
          id: sw_bild_aufnehmen
          state: OFF

switch:
  - platform: template
    name: "ESP Restart"
    id: restart_esp
    optimistic: true
    retain: true

    command_topic: "${mqtt_prefix}/ESP32/restart/command"
    state_topic: "${mqtt_prefix}/ESP32/restart/state"

    turn_on_action:
      - delay: 500ms
      - lambda: |-
          ESP_LOGI("Main", "ESP wird jetzt neugestartet...");
          App.safe_reboot();

  - platform: output
    name: "Blitzlicht LED (GPIO4)"
    id: sw_flash_led
    output: led_output

    command_topic: "${mqtt_prefix}/FlashLED/command"
    state_topic: "${mqtt_prefix}/FlashLED/state"

  - platform: template
    name: "Bild aufnehmen"
    id: sw_bild_aufnehmen
    optimistic: true

    command_topic: "${mqtt_prefix}/Camera/capture/command"
    state_topic: "${mqtt_prefix}/Camera/capture/state"

    turn_on_action:
      - script.execute: bild_aufnehmen

sensor:
  - platform: uptime
    id: se_esp_uptime
    name: "ESP Uptime"
    update_interval: 60s
    state_topic: "${mqtt_prefix}/ESP32/uptime_seconds"

  - platform: template
    name: "ESP Restart Counter"
    id: gs_restart_counter_sensor
    state_topic: "${mqtt_prefix}/ESP32/restart/counter"
    accuracy_decimals: 0

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "WiFi-IPAddress"
      state_topic: "${mqtt_prefix}/WiFi/IPAddress"

    ssid:
      name: "WiFi-SSID"
      state_topic: "${mqtt_prefix}/WiFi/SSID"

    bssid:
      id: bssid_sensor
      name: "WiFi-BSSID"
      state_topic: "${mqtt_prefix}/WiFi/BSSID"
      on_value:
        - text_sensor.template.publish:
            id: ap_name_sensor
            state: !lambda 'return ap_name_from_bssid(x);'

    mac_address:
      name: "WiFi-MacAddress"
      state_topic: "${mqtt_prefix}/WiFi/MAC"

  - platform: template
    name: "WiFi-Access Point Name"
    id: ap_name_sensor
    disabled_by_default: true
    state_topic: "${mqtt_prefix}/WiFi/AccessPoint"

  - platform: template
    name: "ESP Restart Time"
    id: ts_last_boot_time
    update_interval: never
    state_topic: "${mqtt_prefix}/ESP32/restart/time"

    lambda: |-
      if (!id(system_time).now().is_valid()) {
        return {"Warte auf SNTP..."};
      }

      if (isnan(id(se_esp_uptime).state)) {
        return {"Warte auf Uptime..."};
      }

      auto now = id(system_time).now();
      auto boot_timestamp = now.timestamp - (int) id(se_esp_uptime).state;
      auto boot_time = esphome::ESPTime::from_epoch_local(boot_timestamp);

      char str[25];

      snprintf(
        str,
        sizeof(str),
        "%02u.%02u.%02u %02u:%02u:%02u",
        (unsigned int) boot_time.day_of_month,
        (unsigned int) boot_time.month,
        (unsigned int) (boot_time.year % 100),
        (unsigned int) boot_time.hour,
        (unsigned int) boot_time.minute,
        (unsigned int) boot_time.second
      );

      return {str};

  - platform: template
    name: "ESP Uptime formatiert"
    id: ts_esp_update_formatted
    update_interval: 60s
    state_topic: "${mqtt_prefix}/ESP32/uptime"

    lambda: |-
      if (isnan(id(se_esp_uptime).state)) {
        return {"Warte auf Uptime..."};
      }

      uint32_t sekunden = (uint32_t) id(se_esp_uptime).state;
      uint32_t tage = sekunden / 86400;
      uint32_t stunden = (sekunden % 86400) / 3600;
      uint32_t minuten = (sekunden % 3600) / 60;

      char str[20];
      snprintf(str, sizeof(str), "%ud %02u:%02u", tage, stunden, minuten);

      return {str};