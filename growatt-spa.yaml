                      payload: !lambda 'return id(ap_name_sensor).state;'

switch:

  # One-shot input block read for comparison with the cyclic single reads.
  - platform: template
    name: "Growatt Input Vergleich 1082-1123"
    id: input_block_compare
    optimistic: true
    retain: false
    turn_on_action:
      - lambda: |-
          using namespace esphome::modbus_controller;
          id(growatt).queue_command(
            ModbusCommandItem::create_read_command(
              id(growatt), ModbusRegisterType::READ, 1082, 42,
              [](ModbusRegisterType register_type, uint16_t start_address,
                 const std::vector<uint8_t> &data) {
                if (register_type != ModbusRegisterType::READ ||
                    start_address != 1082 || data.size() != 84) {
                  ESP_LOGW("INPUT_COMPARE", "Invalid input block: start=%u, bytes=%u",
                           start_address, static_cast<unsigned>(data.size()));
                  return;
                }
                const bool sent = id(mqtt_client).publish_json(
                  "${mqtt_prefix}/debug/input_1082_1123",
                  [&data](JsonObject root) {
                    char key[6];
                    for (size_t i = 0; i < 42; i++) {
                      snprintf(key, sizeof(key), "%u", static_cast<unsigned>(1082 + i));
                      root[key] = static_cast<uint16_t>(
                        (static_cast<uint16_t>(data[2 * i]) << 8) | data[2 * i + 1]);
                    }
                  });
                ESP_LOGW("INPUT_COMPARE", "Input block MQTT: %s", sent ? "sent" : "failed");
              }
            )
          );
      - switch.turn_off: input_block_compare


  - platform: template
    name: "Growatt Dump Holding 1000-1124"
    id: dump_holding_1000_1124
    optimistic: true
    retain: false
    turn_on_action:
      - lambda: |-
          id(dump_request) = true;
      - delay: 500ms
      - switch.turn_off: dump_holding_1000_1124

  - platform: template
    name: "Growatt Dump Holding 0000-0124"
    id: dump_holding_0000_0124
    optimistic: true
    retain: false
    turn_on_action:
      - lambda: |-
          id(dump_request_0000_0124) = true;
      - delay: 500ms
      - switch.turn_off: dump_holding_0000_0124

  - platform: template
    name: "ESP Restart"
    id: restart_esp
    optimistic: true
    retain: true
    state_topic: "${mqtt_prefix}/ESP/restart/state"
    command_topic: "${mqtt_prefix}/ESP/restart/command"
    turn_on_action:
      - delay: 500ms
      - lambda: ESP.restart();
